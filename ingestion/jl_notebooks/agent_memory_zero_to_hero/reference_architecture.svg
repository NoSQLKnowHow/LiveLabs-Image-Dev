<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" role="img" aria-labelledby="title desc">
<title id="title">Agent memory reference architecture: incident handover</title>
<desc id="desc">Engineers interact with a Python and LangChain agent using Ollama. Oracle Agent Memory manages ingestion and recall in Oracle AI Database. Deep Data Security protects episodic, semantic and procedural records. Embedding and reranking run inside the database. A separate human approval gate controls the handover write.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#526578"/></marker></defs>
<rect width="1100" height="800" rx="12" fill="#f7fafc"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#142d40">
<text x="30" y="37" font-size="25" font-weight="700">What you are building: a memory-aware incident handover agent</text>
<g stroke="#526578" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M230 119 H340"/>
<path d="M740 119 H855" marker-start="url(#arrow)"/>
<path d="M230 229 H290 V279 H340" stroke-dasharray="6 4"/>
<path d="M450 180 V249"/>
<path d="M650 249 V180"/>
<path d="M740 153 H799 V265 H855"/>
<path d="M855 315 H740"/>
<path d="M550 354 V438" marker-start="url(#arrow)"/>
<path d="M230 373 H258 V470 H286" stroke-dasharray="6 4"/>
</g>
<g font-size="14" fill="#405a70">
<text x="250" y="106">request</text><text x="764" y="106">inference</text>
<text x="300" y="244">identity</text><text x="371" y="221">ingest</text>
<text x="666" y="221">recall</text><text x="808" y="217">draft</text>
<text x="752" y="302">approved</text><text x="752" y="332">write</text>
<text x="566" y="400">scoped SQL + retrieved evidence</text>
<text x="63" y="436">setup only</text>
</g>
<g>
<rect x="30" y="79" width="200" height="82" rx="9" fill="#ffffff" stroke="#adbcc8"/>
<text x="48" y="110" font-size="19" font-weight="700">Incident engineers</text>
<text x="48" y="140" font-size="17">Alice / Bob</text>
<rect x="30" y="194" width="200" height="77" rx="9" fill="#ffffff" stroke="#adbcc8"/>
<text x="48" y="224" font-size="19" font-weight="700">IAM identity</text>
<text x="48" y="253" font-size="16">User + app tokens</text>
<rect x="30" y="329" width="200" height="82" rx="9" fill="#ffffff" stroke="#adbcc8"/>
<text x="48" y="361" font-size="19" font-weight="700">Instructor setup</text>
<text x="48" y="390" font-size="16">Owner + security admin</text>
<rect x="340" y="79" width="400" height="101" rx="9" fill="#e5effb" stroke="#4c7fa9"/>
<text x="360" y="112" font-size="21" font-weight="700">Python + LangChain agent</text>
<text x="360" y="143" font-size="17">Scoped tools + compact context</text>
<text x="360" y="165" font-size="15">Propose; never self-approve writes</text>
<rect x="855" y="79" width="215" height="101" rx="9" fill="#eeeafa" stroke="#8b80ad"/>
<text x="873" y="112" font-size="21" font-weight="700">Ollama</text>
<text x="873" y="142" font-size="17">Extract + summarize</text>
<text x="873" y="166" font-size="17">Generate + prune</text>
<rect x="340" y="249" width="400" height="105" rx="9" fill="#e5effb" stroke="#4c7fa9"/>
<text x="360" y="282" font-size="21" font-weight="700">Oracle Agent Memory 26.8</text>
<text x="360" y="312" font-size="17">Persist &#8596; extract &#8596; link &#8596; retrieve</text>
<text x="360" y="338" font-size="17">Context cards, budgets + retention</text>
