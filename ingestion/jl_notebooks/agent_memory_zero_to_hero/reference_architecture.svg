<text x="566" y="605">Facts + preferences</text><text x="566" y="630">Links + historical versions</text>
<rect x="810" y="544" width="240" height="106" rx="7" fill="#f0f6f4" stroke="#c2d7d2"/>
<text x="826" y="575" font-size="20" font-weight="700">Procedural memory</text>
<text x="826" y="605">Approved shared runbooks</text><text x="826" y="630">Reviewed reusable steps</text>
</g>
<rect x="290" y="670" width="760" height="48" rx="5" fill="#e1eeeb"/>
<text x="308" y="700" font-size="18" font-weight="700">In-database ONNX: embedding &#8594; vector retrieval &#8594; reranking</text>
<text x="30" y="780" font-size="16">Solid arrows: runtime flow. Dashed arrows: identity / setup. Review gates do not replace database authorization.</text>
</g></svg>
