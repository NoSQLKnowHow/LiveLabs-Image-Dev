<text x="873" y="312" font-size="17">Review this exact draft</text>
<text x="873" y="338" font-size="17">Write to own thread only</text>
</g>
<rect x="270" y="437" width="800" height="302" rx="12" fill="#ffffff" stroke="#34786d" stroke-width="2"/>
<text x="290" y="470" font-size="23" font-weight="700">Oracle AI Database &#8212; durable memory and state</text>
<rect x="290" y="488" width="760" height="39" rx="5" fill="#dceee9"/>
<text x="310" y="514" font-size="18" font-weight="700">Deep Data Security: database-enforced read / write authorization</text>
