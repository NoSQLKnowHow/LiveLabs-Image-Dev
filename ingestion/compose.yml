services:
  jupyterlab:
    build:
      context: .
      dockerfile: dockerjupyter
    container_name: jupyterlab
    hostname: livelabs
    ports:
      - "8888:8888"
      - "5500:5500"
      - "8501:8501"
      - "8087:8087"
      - "8088:8088"
    environment:
      - OJDBC_PATH=/wallet
      - DBCONNECTION
      - DBPASSWORD
      - SERVICE_NAME
      - USERNAME
      - ORDSURL
      - MONGODBAPI
      - PUBLIC_IP
      - ADB_OCID
    env_file:
      - "/home/opc/.env"
    volumes:
      - "./app/lab/aidata_dev_vscode_privai:/home/:Z"
      - "/home/opc/.env:/home/.env:Z"
      - "/home/opc/.vncpwd.env:/home/.vncpwd.env:Z"
      - "./jl_config/jupyter_lab_config.py:/etc/jupyter/jupyter_lab_config.py:ro,Z"
    restart: always
  ollama:
    container_name: ollama
    hostname: ollama
    build:
      context: .
      dockerfile: dockerfileollama
    volumes:
      - "./model:/root/.ollama:Z"
    ports:
      - "11434:11434"
    restart: always
  privateai:
    image: container-registry.oracle.com/database/private-ai:latest
    container_name: privateai
    hostname: privateai
    environment:
      - PRIVATE_AI_HTTPS_ENABLED=false
      - PRIVATE_AI_AUTHENTICATION_ENABLED=false
      - PRIVATE_AI_LOG_STDOUT_ENABLED=true
    ports:
      - "8080:8080"
    restart: always
  aidbfree:
    image: container-registry.oracle.com/database/free:latest
    container_name: aidbfree
    hostname: aidbfree
    environment:
      - ORACLE_PWD=${ORACLE_PWD}
    ports:
      - "1521:1521"
    volumes:
      - "./oradata:/opt/oracle/oradata:Z,U"
      - "./db-startup:/opt/oracle/scripts/startup:Z"
      - "./dmdump:/opt/oracle/dmdump:Z,U"
    restart: always
