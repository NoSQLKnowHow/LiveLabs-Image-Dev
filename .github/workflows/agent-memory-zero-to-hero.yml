name: Agent Memory zero-to-hero notebook checks

on:
  pull_request:
    paths:
      - ingestion/jl_notebooks/agent_memory_zero_to_hero/**
      - ingestion/db-startup/60-agent-memory-zero-to-hero.sh
      - .github/workflows/agent-memory-zero-to-hero.yml
  push:
    branches: [feat/agent-memory-zero-to-hero]
    paths:
      - ingestion/jl_notebooks/agent_memory_zero_to_hero/**
      - ingestion/db-startup/60-agent-memory-zero-to-hero.sh
      - .github/workflows/agent-memory-zero-to-hero.yml

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ingestion/jl_notebooks/agent_memory_zero_to_hero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ingestion/jl_notebooks/agent_memory_zero_to_hero/requirements.txt
      - name: Install the published 26.8 dependency set
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validate matched notebooks
        run: python validate_notebooks.py
      - name: Check adapters, public signatures and scoped tools
        run: python -m unittest discover -s tests -v
      - name: Check opt-in provisioning without a database
        run: |
          bash -n setup_kernel.sh
          bash -n ../../db-startup/60-agent-memory-zero-to-hero.sh
          bash ../../db-startup/60-agent-memory-zero-to-hero.sh
